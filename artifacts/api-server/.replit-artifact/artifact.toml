kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.development.env]
ENGINE_URL = "http://127.0.0.1:8090"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
ENGINE_URL = "http://127.0.0.1:8090"

[services.production.health.startup]
path = "/api/healthz"

# ActiveGraph simulation engine sidecar. Internal-only: no `paths`, so it is
# never proxied publicly; it binds 127.0.0.1 and is reached only by the
# Express API server via ENGINE_URL.
[[services]]
localPort = 8090
name = "Engine"
paths = []

[services.development]
run = "uv run python engine/server.py"

[services.development.env]
ENGINE_PORT = "8090"

[services.production]

[services.production.run]
args = ["uv", "run", "python", "artifacts/api-server/engine/server.py"]

[services.production.run.env]
ENGINE_PORT = "8090"
