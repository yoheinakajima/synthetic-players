name: Inspect staged release payload

on:
  push:
    branches: [agent/final-release-payload-staging]
    paths:
      - '.github/workflows/inspect-staged-payload.yml'
      - 'scripts/final_release_chunks/**'
  pull_request:
    paths:
      - '.github/workflows/inspect-staged-payload.yml'
      - 'scripts/final_release_chunks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect partial stream
        shell: bash
        run: |
          set -euo pipefail
          echo 'CHUNK SIZES AND HASHES'
          wc -c scripts/final_release_chunks/payload-*.txt
          sha256sum scripts/final_release_chunks/payload-*.txt
          mkdir -p /tmp/staged-payload-recovery
          cat scripts/final_release_chunks/payload-*.txt > /tmp/staged-payload-recovery/payload-prefix.b64
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          root=Path('/tmp/staged-payload-recovery')
          raw=''.join((root/'payload-prefix.b64').read_text().split())
          print('base64_chars', len(raw))
          compressed=base64.b64decode(raw, validate=True)
          (root/'payload-prefix.gz').write_bytes(compressed)
          print('compressed_bytes', len(compressed))
          print('compressed_sha256', hashlib.sha256(compressed).hexdigest())
          d=zlib.decompressobj(16+zlib.MAX_WBITS)
          out=d.decompress(compressed)
          (root/'payload-prefix.tar').write_bytes(out)
          print('decompressed_bytes', len(out))
          print('gzip_eof', d.eof)
          print('unconsumed_tail', len(d.unconsumed_tail))
          PY
          echo 'TAR MEMBERS RECOVERABLE FROM PREFIX'
          tar -tvf /tmp/staged-payload-recovery/payload-prefix.tar --ignore-zeros || true
          cp scripts/final_release_chunks/payload-*.txt /tmp/staged-payload-recovery/
      - uses: actions/upload-artifact@v4
        with:
          name: staged-payload-recovery
          path: /tmp/staged-payload-recovery/
          retention-days: 1
