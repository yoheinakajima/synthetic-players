name: submission-gate-analyses

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/submission-gate-analyses.yml'
      - 'scripts/paper_submission_lint.py'
      - 'scripts/augment_p13_audit_variants.py'
      - 'scripts/generate_prompt_delta_figure.py'
      - 'scripts/explore_v11_variance.py'
      - 'scripts/apply_explore_v11.py'
      - 'scripts/finalize_explore_v11.py'
      - 'scripts/generate_review_figures_v11.py'
      - 'scripts/build_review_pdf_v11.py'
      - 'artifacts/api-server/engine/submission_gate_analyses.py'
      - 'artifacts/api-server/engine/submission_gate_finalize.py'
      - 'artifacts/api-server/engine/submission_gate_exact_cluster.py'
      - 'artifacts/api-server/engine/submission_gate_variance_fixed.py'
      - 'artifacts/api-server/engine/round5_review_audit.py'
      - 'artifacts/api-server/engine/phase5_closeout_adjudicate.py'
      - 'artifacts/api-server/engine/phase4_adjudicate.py'
      - 'README.md'
      - 'REVIEW.md'
      - 'CITATION.cff'
      - 'docs/paper/**'
      - 'docs/reviews/**'
      - 'docs/analysis/**'
      - 'docs/phase5/**'
      - 'docs/phase5-close/**'
      - 'capsule/data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submission-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis and replay dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib uv

      - name: Stage archived databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-server/engine/data
          xz -dkc capsule/data/engine.db.xz > artifacts/api-server/engine/data/engine.db
          xz -dkc capsule/data/budget.db.xz > artifacts/api-server/engine/data/budget.db
          cp capsule/data/phase4-driver-plan.json capsule/data/phase4-driver-state.json \
             capsule/data/phase5-driver-plan.json capsule/data/phase5-driver-state.json \
             artifacts/api-server/engine/data/ 2>/dev/null || true

      - name: Run zero-call analyses and integrate v11 review revision
        env:
          SUBMISSION_DIRICHLET_DRAWS: '200000'
          SUBMISSION_FAMILY_PERMUTATIONS: '200000'
          SUBMISSION_FAMILY_BATCH: '5000'
          SUBMISSION_VARIANCE_BOOTSTRAPS: '50000'
          ROUND5_ATTAINABILITY_PERMUTATIONS: '200000'
          ROUND5_ATTAINABILITY_BATCH: '5000'
          ROUND5_POWER_REPS: '10000'
          ROUND5_POWER_BATCH: '1000'
          V11_LATENT_DRAWS: '100000'
        shell: bash
        run: |
          set -euo pipefail
          python artifacts/api-server/engine/submission_gate_analyses.py | tee /tmp/submission-analysis.log
          python artifacts/api-server/engine/submission_gate_finalize.py | tee -a /tmp/submission-analysis.log
          python artifacts/api-server/engine/submission_gate_exact_cluster.py | tee -a /tmp/submission-analysis.log
          python scripts/augment_p13_audit_variants.py | tee -a /tmp/submission-analysis.log
          python artifacts/api-server/engine/submission_gate_variance_fixed.py | tee -a /tmp/submission-analysis.log
          python scripts/generate_prompt_delta_figure.py | tee -a /tmp/submission-analysis.log
          python artifacts/api-server/engine/round5_review_audit.py | tee -a /tmp/submission-analysis.log
          python scripts/explore_v11_variance.py | tee -a /tmp/submission-analysis.log
          python scripts/apply_explore_v11.py | tee -a /tmp/submission-analysis.log
          python scripts/finalize_explore_v11.py | tee -a /tmp/submission-analysis.log
          python scripts/generate_review_figures_v11.py | tee -a /tmp/submission-analysis.log

      - name: Install reviewer-PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern \
            fonts-linuxlibertine fonts-lato poppler-utils

      - name: Build and preflight v11 reviewer PDF
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_review_pdf_v11.py
          pages="$(pdfinfo docs/paper/synthetic-players-review-v11.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -ge 18
          test "$pages" -le 26
          pdftotext docs/paper/synthetic-players-review-v11.pdf /tmp/v11-paper.txt
          python - <<'PY'
          import json
          from pathlib import Path
          paper = Path('docs/paper/paper-draft.md').read_text(encoding='utf-8')
          required = [
              'REVIEW REVISION v11',
              'Dirichlet(0.5, 0.5, 0.5)',
              '0.4122 for their δ=.50 panel',
              'rep-d90-s2a` and `os-swap',
              '90 of 704 seat decisions across 352 independent episodes',
              '16+4+4=24',
              'posterior median between shares of 63%–71%',
              'After every round there is a {deltaPct}% chance',
          ]
          missing = [marker for marker in required if marker not in paper]
          if missing:
              raise SystemExit(f'missing manuscript markers: {missing}')
          figure_source = Path('scripts/generate_review_figures_v11.py').read_text(encoding='utf-8')
          if 'p = 0.05' not in figure_source:
              raise SystemExit('Figure 5 p=.05 label missing from generator')
          extracted = Path('/tmp/v11-paper.txt').read_text(encoding='utf-8')
          if 'pay- 40 off' in extracted:
              raise SystemExit('line-number extraction artifact remains in PDF text')
          for path in [
              'docs/paper/synthetic-players-review-v11.sha256',
              'docs/paper/synthetic-players-review-v11-artifact.json',
              'docs/analysis/submission/figure-sources/variance-uncertainty-v11.json',
          ]:
              if not Path(path).is_file() or Path(path).stat().st_size == 0:
                  raise SystemExit(f'missing generated artifact: {path}')
          count = Path('docs/analysis/submission/count-reconciliation.md').read_text(encoding='utf-8')
          if 'Phase 4+5 response events | 30,397' not in count:
              raise SystemExit('request/response count reconciliation missing')
          episode = Path('docs/analysis/submission/episode-cluster-sensitivity.md').read_text(encoding='utf-8')
          if 'exact-corner degeneracy is **not** itself a false-positive mechanism' not in episode:
              raise SystemExit('bootstrap rationale regression')
          summary = json.loads(Path('docs/analysis/submission/submission-analysis-summary.json').read_text(encoding='utf-8'))
          if 'v11VarianceUncertainty' not in summary:
              raise SystemExit('machine-readable v11 uncertainty section missing')
          print('v11 preflight markers: PASS')
          PY

      - name: Lint paper surface and sealed boundary
        run: python scripts/paper_submission_lint.py --base origin/main

      - name: Verify reproduction capsule
        run: bash capsule/verify.sh

      - name: Upload v11 review package
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-players-review-v11
          path: |
            README.md
            REVIEW.md
            CITATION.cff
            docs/analysis/submission/
            docs/analysis/submission-blockers.md
            docs/paper/
            docs/reviews/
            /tmp/submission-analysis.log
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated v11 analyses, figures, PDF, and review records
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md REVIEW.md CITATION.cff docs/analysis docs/paper docs/reviews
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'integrate Explore Science v10 review into v11 [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
