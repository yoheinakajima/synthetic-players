name: submission-gate-analyses

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/submission-gate-analyses.yml'
      - 'scripts/paper_submission_lint.py'
      - 'scripts/integrate_submission_results.py'
      - 'scripts/augment_p13_audit_variants.py'
      - 'scripts/generate_prompt_delta_figure.py'
      - 'scripts/generate_review_figures.py'
      - 'scripts/build_review_pdf.py'
      - 'scripts/finalize_round5_v7.py'
      - 'scripts/polish_v7_outputs.py'
      - 'scripts/apply_claude_v8.py'
      - 'scripts/finalize_v8_headers.py'
      - 'scripts/apply_round8_v10.py'
      - 'scripts/materialize_draft_history.py'
      - 'artifacts/api-server/engine/submission_gate_analyses.py'
      - 'artifacts/api-server/engine/submission_gate_finalize.py'
      - 'artifacts/api-server/engine/submission_gate_exact_cluster.py'
      - 'artifacts/api-server/engine/submission_gate_variance_fixed.py'
      - 'artifacts/api-server/engine/round5_review_audit.py'
      - 'artifacts/api-server/engine/phase5_closeout_adjudicate.py'
      - 'artifacts/api-server/engine/phase4_adjudicate.py'
      - 'README.md'
      - 'REVIEW.md'
      - 'CITATION.cff'
      - 'docs/paper/**'
      - 'docs/reviews/**'
      - 'docs/analysis/**'
      - 'docs/phase5/**'
      - 'docs/phase5-close/**'
      - 'capsule/data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submission-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis, replay, and timestamp dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib uv opentimestamps-client

      - name: Stage archived databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-server/engine/data
          xz -dkc capsule/data/engine.db.xz > artifacts/api-server/engine/data/engine.db
          xz -dkc capsule/data/budget.db.xz > artifacts/api-server/engine/data/budget.db
          cp capsule/data/phase4-driver-plan.json capsule/data/phase4-driver-state.json \
             capsule/data/phase5-driver-plan.json capsule/data/phase5-driver-state.json \
             artifacts/api-server/engine/data/ 2>/dev/null || true

      - name: Run zero-call analyses and preserve v10 text freeze
        env:
          SUBMISSION_DIRICHLET_DRAWS: '200000'
          SUBMISSION_FAMILY_PERMUTATIONS: '200000'
          SUBMISSION_FAMILY_BATCH: '5000'
          SUBMISSION_VARIANCE_BOOTSTRAPS: '50000'
          ROUND5_ATTAINABILITY_PERMUTATIONS: '200000'
          ROUND5_ATTAINABILITY_BATCH: '5000'
          ROUND5_POWER_REPS: '10000'
          ROUND5_POWER_BATCH: '1000'
        shell: bash
        run: |
          set -euo pipefail
          python artifacts/api-server/engine/submission_gate_analyses.py | tee /tmp/submission-analysis.log
          python artifacts/api-server/engine/submission_gate_finalize.py | tee -a /tmp/submission-analysis.log
          python artifacts/api-server/engine/submission_gate_exact_cluster.py | tee -a /tmp/submission-analysis.log
          python scripts/augment_p13_audit_variants.py | tee -a /tmp/submission-analysis.log
          python artifacts/api-server/engine/submission_gate_variance_fixed.py | tee -a /tmp/submission-analysis.log
          python scripts/generate_prompt_delta_figure.py | tee -a /tmp/submission-analysis.log
          python scripts/integrate_submission_results.py | tee -a /tmp/submission-analysis.log
          python scripts/materialize_draft_history.py | tee -a /tmp/submission-analysis.log
          python artifacts/api-server/engine/round5_review_audit.py | tee -a /tmp/submission-analysis.log
          python scripts/finalize_round5_v7.py | tee -a /tmp/submission-analysis.log
          python scripts/polish_v7_outputs.py | tee -a /tmp/submission-analysis.log
          python scripts/apply_claude_v8.py | tee -a /tmp/submission-analysis.log
          python scripts/finalize_v8_headers.py | tee -a /tmp/submission-analysis.log
          python scripts/apply_round8_v10.py | tee -a /tmp/submission-analysis.log
          python scripts/generate_review_figures.py | tee -a /tmp/submission-analysis.log

      - name: Install reviewer-PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern \
            fonts-linuxlibertine fonts-lato poppler-utils

      - name: Build, timestamp, and preflight v10 reviewer PDF
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_review_pdf.py
          sha_file='docs/paper/synthetic-players-review-v10.sha256'
          ots_file="${sha_file}.ots"
          rm -f "$ots_file"
          for attempt in 1 2 3; do
            if ots stamp "$sha_file"; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          test -s "$ots_file"
          pages="$(pdfinfo docs/paper/synthetic-players-review-v10.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -ge 16
          test "$pages" -le 24
          pdftotext docs/paper/synthetic-players-review-v10.pdf /tmp/v10-paper.txt
          grep -Fq 'References' /tmp/v10-paper.txt
          grep -Fq 'TEXT FREEZE v10' docs/paper/paper-draft.md
          grep -Fq 'broad-reference marginal criteria' docs/paper/paper-draft.md
          grep -Fq 'broad-reference marginal checks' docs/paper/paper-draft.md
          grep -Fq '\widehat p=(r+1)/(B+1)' docs/paper/paper-draft.md
          grep -Fq '12 of the 28 possible episode-value compositions' docs/paper/paper-draft.md
          grep -Fq 'text-freeze source commit' /tmp/v10-paper.txt
          ! grep -Fq 'questions for Explore Science' docs/paper/paper-draft.md
          test -s "$sha_file"
          test -s docs/paper/synthetic-players-review-v10-artifact.json
          test -s docs/paper/text-freeze-v10.json
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path('docs/paper/synthetic-players-review-v10-artifact.json').read_text())
          freeze = json.loads(Path('docs/paper/text-freeze-v10.json').read_text())
          summary = json.loads(Path('docs/analysis/submission/submission-analysis-summary.json').read_text())
          assert 16 <= artifact['pages'] <= 24
          assert len(artifact['pdf_sha256']) == 64
          assert artifact['source_commit'] == freeze['source_commit']
          assert summary['textFreeze']['pdfSha256'] == artifact['pdf_sha256']
          PY

      - name: Lint paper surface and sealed boundary
        run: python scripts/paper_submission_lint.py --base origin/main

      - name: Verify reproduction capsule
        run: bash capsule/verify.sh

      - name: Upload v10 review and freeze package
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-players-review-v10
          path: |
            README.md
            REVIEW.md
            CITATION.cff
            docs/analysis/submission/
            docs/analysis/submission-blockers.md
            docs/paper/
            docs/reviews/
            /tmp/submission-analysis.log
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated v10 PDF, checksum, proof, and manifests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md REVIEW.md CITATION.cff docs/analysis docs/paper docs/reviews
          if ! git diff --cached --quiet; then
            git commit -m 'freeze v10 review artifact [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo 'No generated changes to commit.'
          fi

      - name: Create generic v10 freeze tag
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag='paper-text-freeze-v10'
          head="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged="$(git rev-list -n1 "$tag")"
            test "$tagged" = "$head"
          else
            git tag -a "$tag" -m 'Synthetic Players manuscript text freeze v10'
            git push origin "$tag"
          fi
