name: preprint-v13

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/preprint-v12.yml'
      - 'scripts/**'
      - 'artifacts/api-server/engine/**'
      - 'capsule/**'
      - 'docs/paper/**'
      - 'docs/analysis/**'
      - 'docs/reviews/**'
      - 'README.md'
      - 'REVIEW.md'
      - 'CITATION.cff'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preprint-v13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'paper/preprint-v14'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib uv
      - name: Stage archived databases
        run: |
          mkdir -p artifacts/api-server/engine/data
          xz -dkc capsule/data/engine.db.xz > artifacts/api-server/engine/data/engine.db
          xz -dkc capsule/data/budget.db.xz > artifacts/api-server/engine/data/budget.db
          cp capsule/data/phase4-driver-plan.json capsule/data/phase4-driver-state.json capsule/data/phase5-driver-plan.json capsule/data/phase5-driver-state.json artifacts/api-server/engine/data/ 2>/dev/null || true
      - name: Regenerate record and integrate v13
        env:
          SUBMISSION_DIRICHLET_DRAWS: '200000'
          SUBMISSION_FAMILY_PERMUTATIONS: '200000'
          SUBMISSION_FAMILY_BATCH: '5000'
          SUBMISSION_VARIANCE_BOOTSTRAPS: '50000'
          ROUND5_ATTAINABILITY_PERMUTATIONS: '200000'
          ROUND5_ATTAINABILITY_BATCH: '5000'
          ROUND5_POWER_REPS: '10000'
          ROUND5_POWER_BATCH: '1000'
          V11_LATENT_DRAWS: '100000'
          V12_BOOTSTRAP_REPS: '250000'
        run: |
          set -euo pipefail
          python artifacts/api-server/engine/submission_gate_analyses.py
          python artifacts/api-server/engine/submission_gate_finalize.py
          python artifacts/api-server/engine/submission_gate_exact_cluster.py
          python scripts/augment_p13_audit_variants.py
          python artifacts/api-server/engine/submission_gate_variance_fixed.py
          python scripts/generate_prompt_delta_figure.py
          python artifacts/api-server/engine/round5_review_audit.py
          python scripts/explore_v11_variance.py
          python scripts/repair_v12_audits.py
          python scripts/v12_audits.py
          (cd artifacts/api-server && uv run --with numpy --with scipy python engine/phase3_replay_audit.py)
          python scripts/repair_apply_preprint_v12.py
          python scripts/apply_preprint_v12.py
          python scripts/generate_review_figures_v11.py
          python scripts/v13_p52_audit.py
          python scripts/apply_preprint_v13.py
          python scripts/generate_prompt_figure_v13.py
          cp artifacts/api-server/engine/phase3_replay_audit.py capsule/artifacts/api-server/engine/phase3_replay_audit.py
          python scripts/polish_repo_v12.py
          python scripts/update_capsule_manifest_v12.py
          python -m py_compile scripts/v13_p52_audit.py scripts/apply_preprint_v13.py scripts/generate_prompt_figure_v13.py scripts/build_preprint_pdf_v13.py
      - name: Install PDF dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern fonts-linuxlibertine fonts-lato poppler-utils
      - name: Build and preflight v13 PDF
        run: |
          set -euo pipefail
          python scripts/build_preprint_pdf_v13.py
          pdf='docs/paper/synthetic-players-preprint-v13.pdf'
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          test "$pages" -ge 16
          test "$pages" -le 28
          pdftotext "$pdf" /tmp/preprint-v13.txt
          python - <<'PY'
          from pathlib import Path

          source = Path('docs/paper/paper-draft.md').read_text(encoding='utf-8')
          extracted = Path('/tmp/preprint-v13.txt').read_text(encoding='utf-8')
          normalized_pdf = ' '.join(extracted.split())
          errors = []

          required_source = [
              '0.071, 0.189',
              'study-wide alpha allocation',
              'preregistered heuristic tolerance',
              'never decoded as an action',
              'fixed-panel Dirichlet–Jeffreys latent-propensity aggregation',
          ]
          for marker in required_source:
              if marker not in source:
                  errors.append(f'manuscript source missing {marker!r}')

          required_pdf = [
              'Abstract',
              '0.071',
              '0.189',
              'P5-2',
              '0.172',
              '0.195',
              'provider-failure',
          ]
          for marker in required_pdf:
              if marker not in normalized_pdf:
                  errors.append(f'PDF text missing {marker!r}')

          for path in (
              'docs/paper/synthetic-players-preprint-v13.sha256',
              'docs/paper/synthetic-players-preprint-v13-artifact.json',
              'docs/analysis/submission/v13/p52-dependence-audit.json',
          ):
              if not Path(path).is_file() or Path(path).stat().st_size == 0:
                  errors.append(f'missing generated artifact {path}')

          if errors:
              raise SystemExit('v13 preflight failed:\n- ' + '\n- '.join(errors))
          print(f'preprint v13 preflight: PASS ({pages if False else len(extracted.splitlines())} extracted lines)')
          PY
      - name: Lint living assertions and sealed boundary
        run: python scripts/paper_submission_lint.py --base origin/main
      - name: Verify complete confirmatory capsule
        run: bash capsule/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-players-preprint-v13
          path: |
            README.md
            REVIEW.md
            CITATION.cff
            docs/paper/paper-draft.md
            docs/paper/synthetic-players-preprint-v13.pdf
            docs/paper/synthetic-players-preprint-v13.sha256
            docs/paper/synthetic-players-preprint-v13-artifact.json
            docs/paper/figures/
            docs/analysis/submission/v13/
            docs/reviews/round-11-*.md
          retention-days: 30
      - name: Commit generated v13 outputs
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f capsule/artifacts/api-server/engine/data/engine.db capsule/artifacts/api-server/engine/data/budget.db capsule/artifacts/api-server/engine/data/engine.db-shm capsule/artifacts/api-server/engine/data/engine.db-wal
          git add -A -- README.md REVIEW.md CITATION.cff capsule capsule-README.md docs/analysis docs/paper docs/reviews scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build and validate preprint v13 for Claude review [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
