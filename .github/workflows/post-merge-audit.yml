name: Post-merge release audit

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/post-merge-audit.yml']

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/blob-transport-test'
    runs-on: ubuntu-24.04
    env:
      MERGE_SHA: c39948965bb238a89c1d81781072a102e7826f35
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identify post-merge workflow runs
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['MERGE_SHA']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'synthetic-players-post-merge-audit/1.0'},
          )
          with urllib.request.urlopen(req,timeout=45) as response:
              payload=json.load(response)
          selected={}
          for run in sorted(payload.get('workflow_runs',[]),key=lambda item:item.get('run_number',0),reverse=True):
              if run.get('head_sha')==sha and run.get('event')=='push':
                  selected.setdefault(run.get('name'),run)
          summary={name:{key:run.get(key) for key in ('id','run_number','status','conclusion','html_url','jobs_url')} for name,run in selected.items()}
          print(json.dumps(summary,indent=2,sort_keys=True))
          expected={'Final arXiv release','Deploy project site'}
          missing=expected-set(selected)
          failures={name:selected[name].get('conclusion') for name in expected&set(selected) if selected[name].get('conclusion')!='success'}
          if missing or failures:
              raise SystemExit(f'post-merge workflows not green: missing={sorted(missing)} failures={failures}')
          print('POST_MERGE_WORKFLOWS_GREEN')
          PY
