name: Deploy project site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/paper/synthetic-players.pdf'
      - 'docs/paper/synthetic-players-arxiv-source.zip'
      - 'docs/paper/figures/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          rm -rf _site
          cp -R site _site
          mkdir -p _site/assets
          cp docs/paper/synthetic-players.pdf _site/paper.pdf
          cp docs/paper/synthetic-players-arxiv-source.zip _site/arxiv-source.zip
          cp docs/paper/figures/between-prompt-share.png _site/assets/
          cp docs/paper/figures/prompt-indexed-delta.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
