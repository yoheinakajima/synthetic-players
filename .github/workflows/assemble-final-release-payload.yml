name: Assemble verified final release payload
on:
  pull_request:
    branches: [paper/arxiv-final]
    paths: ['.github/workflows/assemble-final-release-payload.yml','scripts/final_release_transport/**','scripts/recover_final_source.py','scripts/build_final_chunks.py']
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/final-release-payload-staging, fetch-depth: 0}
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zstd texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - run: python scripts/recover_final_source.py
      - env: {SOURCE_DATE_EPOCH: '1785542400', TZ: UTC}
        run: cd /tmp/final-release/arxiv && pdflatex -interaction=nonstopmode -halt-on-error main.tex >/tmp/p1 && pdflatex -interaction=nonstopmode -halt-on-error main.tex >/tmp/p2 && test "$(sha256sum main.pdf|cut -d' ' -f1)" = c5f153198eb7987d8fc2156902a412691d01188f38b5362c44f74c4f979c98f8 && test "$(pdfinfo main.pdf|awk '/^Pages:/{print $2}')" = 19
      - run: |
          python scripts/build_final_chunks.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/assemble-final-release-payload.yml scripts
          git commit -m 'Assemble ten verified final release chunks [skip ci]'
          git push origin HEAD:agent/final-release-payload-staging
