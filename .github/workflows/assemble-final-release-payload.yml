name: Assemble verified final release payload
on:
  pull_request:
    branches: [paper/arxiv-final]
    paths: ['.github/workflows/assemble-final-release-payload.yml','scripts/final_release_transport/**','scripts/recover_final_source.py','scripts/build_final_chunks.py']
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/final-release-payload-staging, fetch-depth: 0}
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends zstd texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - run: python scripts/recover_final_source.py
      - env: {SOURCE_DATE_EPOCH: '1785542400', TZ: UTC}
        run: |
          cd /tmp/final-release/arxiv
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/tmp/p1
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >/tmp/p2
          test "$(pdfinfo main.pdf|awk '/^Pages:/{print $2}')" = 19
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess
          root=Path('/home/runner/work/synthetic-players/synthetic-players')
          raw=(root/'scripts/final_release_transport/pdf-current-00.txt').read_text().strip()
          patch=base64.b64decode(raw,validate=True)
          assert hashlib.sha256(patch).hexdigest()=='4b03fe22cea84232accc9f9d97bc0c3361ad898576d101b4a238b7d70b2e4e1f'
          Path('/tmp/pdf-current.zst').write_bytes(patch)
          subprocess.run(['zstd','-q','-d','--patch-from=main.pdf','/tmp/pdf-current.zst','-o','main.final.pdf'],check=True)
          assert hashlib.sha256(Path('main.final.pdf').read_bytes()).hexdigest()=='c5f153198eb7987d8fc2156902a412691d01188f38b5362c44f74c4f979c98f8'
          Path('main.final.pdf').replace('main.pdf')
          PY
          test "$(sha256sum main.pdf|cut -d' ' -f1)" = c5f153198eb7987d8fc2156902a412691d01188f38b5362c44f74c4f979c98f8
          test "$(pdfinfo main.pdf|awk '/^Pages:/{print $2}')" = 19
      - run: |
          python scripts/build_final_chunks.py
          test "$(find scripts/final_release_chunks -maxdepth 1 -name 'payload-[0-9][0-9].txt' | wc -l)" = 10
          python scripts/install_final_release.py
          test "$(sha256sum docs/paper/synthetic-players.pdf|cut -d' ' -f1)" = c5f153198eb7987d8fc2156902a412691d01188f38b5362c44f74c4f979c98f8
          test "$(sha256sum docs/paper/synthetic-players-arxiv-source.zip|cut -d' ' -f1)" = 0b75e83583f58b2020feeee86ff999173a6d466be682a6b7471f950b36fdf0b1
          test "$(sha256sum docs/paper/paper.md|cut -d' ' -f1)" = b6c8a95d5eba541d23256b36ab3a1c64c4d89a4db52f66762291bc9409d00dc4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/assemble-final-release-payload.yml scripts
          git commit -m 'Assemble ten verified final release chunks [skip ci]'
          git push origin HEAD:agent/final-release-payload-staging
